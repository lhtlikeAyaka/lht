name: Build ESP32-S3 voice assistant firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoiceAssistant/**'
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions/voiceassistant_multinet.csv'
      - '.github/workflows/build-firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.1
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.1"

      - name: Configure ESP32-S3 target
        run: idf.py set-target esp32s3

      - name: Verify project entry and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s main/main.cpp
          test -s main/CMakeLists.txt
          test -s main/idf_component.yml
          grep -q 'extern "C" void app_main' main/main.cpp
          grep -q 'CONFIG_AUTOSTART_ARDUINO=n' sdkconfig.defaults
          grep -q 'CONFIG_SR_MN_CN_MULTINET6_QUANT=y' sdkconfig.defaults

      - name: Build firmware and bundled ESP-SR model
        run: idf.py build

      - name: Validate and prepare flash artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/voice_assistant.bin
          test -s build/srmodels/srmodels.bin

          APP_BYTES="$(stat -c '%s' build/voice_assistant.bin)"
          MODEL_BYTES="$(stat -c '%s' build/srmodels/srmodels.bin)"
          (( APP_BYTES <= 3145728 )) || { echo "Application is ${APP_BYTES} bytes; app partition is 3 MiB"; exit 1; }
          (( MODEL_BYTES <= 6291456 )) || { echo "Model bundle is ${MODEL_BYTES} bytes; model partition is 6 MiB"; exit 1; }

          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/voice_assistant.bin artifacts/
          cp build/srmodels/srmodels.bin artifacts/
          cat > artifacts/flash-offsets.txt <<'INFO'
          ESP32-S3-N16R8 flash layout (16 MB)
          bootloader.bin       0x000000
          partition-table.bin  0x008000
          voice_assistant.bin  0x010000 (app0)
          srmodels.bin         0x9F0000 (model partition)

          Do not flash srmodels.bin at the application address.
          Use the exact offsets above with esptool.py write_flash.
          First migration to this partition table requires a full reflash.
          INFO
          printf 'Application size: %s bytes\\nModel bundle size: %s bytes\\n' "$APP_BYTES" "$MODEL_BYTES" > artifacts/build-sizes.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-esp32s3-idf-firmware
          path: artifacts/*
          if-no-files-found: error
